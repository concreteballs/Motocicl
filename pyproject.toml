[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motocicl"
version = "0.1.0"
description = "YJ64 autonomous cycle orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - project owner controlled" }
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

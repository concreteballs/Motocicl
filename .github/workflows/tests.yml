name: Motocicl tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motocicl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d motocicl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOTOCICL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/motocicl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Prepare CI diagnostics
        if: always()
        run: mkdir -p ci-artifacts
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long --junitxml=ci-artifacts/pytest-junit.xml 2>&1 | tee ci-artifacts/pytest.log
      - name: Build worker container
        shell: bash
        run: |
          set -o pipefail
          docker build --pull -t motocicl-worker:ci . 2>&1 | tee ci-artifacts/docker-build.log
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motocicl-ci-diagnostics-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

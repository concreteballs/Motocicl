name: Motocicl tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motocicl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d motocicl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOTOCICL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/motocicl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build worker container
        run: docker build --pull -t motocicl-worker:ci .
